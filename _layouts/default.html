<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8"/>

    <title>
      {% if page.title %}
      {{page.title | escape }}
      {% endif %}
      {{ site.name | escape }}
    </title>


    <meta name="theme-color" id="theme-color-meta" content="#ffffff">

    <script>
      // Apply a saved theme before first paint so the page never flashes the
      // wrong one. No saved theme means follow the OS, which CSS handles.
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          if (saved === 'dark' || saved === 'light') {
            document.documentElement.setAttribute('data-theme', saved);
          }
          var dark = saved
            ? saved === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches;
          document
            .getElementById('theme-color-meta')
            .setAttribute('content', dark ? '#15171c' : '#ffffff');
        } catch (e) {}
      })();
    </script>

    <link href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.6/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ site.baseurl }}/stylesheets/style.css" rel="stylesheet" />

    <script>
      // Theme toggle. Absent an explicit choice the page follows the OS, so
      // the first click resolves the current appearance and flips it.
      (function () {
        var root = document.documentElement;
        var toggle = document.getElementById('theme-toggle');
        var meta = document.getElementById('theme-color-meta');
        var systemDark = window.matchMedia('(prefers-color-scheme: dark)');

        function currentTheme() {
          var explicit = root.getAttribute('data-theme');
          if (explicit === 'dark' || explicit === 'light') {
            return explicit;
          }
          return systemDark.matches ? 'dark' : 'light';
        }

        function sync() {
          var theme = currentTheme();
          var next = theme === 'dark' ? 'light' : 'dark';
          if (meta) {
            meta.setAttribute('content', theme === 'dark' ? '#15171c' : '#ffffff');
          }
          if (toggle) {
            toggle.setAttribute('title', 'Switch to ' + next + ' theme');
            toggle.setAttribute('aria-label', 'Switch to ' + next + ' theme');
          }
        }

        if (toggle) {
          toggle.addEventListener('click', function (event) {
            event.preventDefault();
            var next = currentTheme() === 'dark' ? 'light' : 'dark';
            root.setAttribute('data-theme', next);
            try {
              localStorage.setItem('theme', next);
            } catch (e) {}
            sync();
          });
        }

        function onSystemChange() {
          if (!root.hasAttribute('data-theme')) {
            sync();
          }
        }

        if (systemDark.addEventListener) {
          systemDark.addEventListener('change', onSystemChange);
        } else if (systemDark.addListener) {
          systemDark.addListener(onSystemChange);
        }

        sync();
      })();
    </script>

    <script src="//code.jquery.com/jquery-1.11.3.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.6/js/bootstrap.min.js" integrity="sha256-KXn5puMvxCw+dAYznun+drMdG1IFl3agK0p/pqT9KAo= sha512-2e8qq0ETcfWRI4HJBzQiA3UoyFk6tbNyG+qSaIBZLyW9Xf3sWZHN/lxe9fTh1U45DpPf07yj94KsUHHWe4Yk1A==" crossorigin="anonymous"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <script src="https://unpkg.com/lunr/lunr.js"></script>
    <script>
      var searchIndex = null;
      var searchData = null;
      var searchReady = false;

      // Load search data
      fetch('{{ site.baseurl }}/search.json')
        .then(response => response.json())
        .then(data => {
          searchData = data;
          searchIndex = lunr(function () {
            this.ref('url');
            this.field('title', { boost: 10 });
            this.field('content');
            this.field('tags', { boost: 5 });
            this.field('category');

            data.forEach(function (doc) {
              this.add(doc);
            }, this);
          });
          searchReady = true;

          // Execute search if there's a pending query
          var searchInput = document.getElementById('search-input');
          if (searchInput && searchInput.value.length > 2) {
            performSearch(searchInput.value);
            document.getElementById('search-clear').style.display = 'block';
          }
        });

      // Search function
      function performSearch(query) {
        if (!searchIndex || !query) {
          document.getElementById('search-results').style.display = 'none';
          document.getElementById('content').style.display = 'block';
          return;
        }

        var results = searchIndex.search(query);
        displayResults(results);
      }

      // Display results
      function displayResults(results) {
        var searchResultsList = document.getElementById('search-results-list');
        searchResultsList.innerHTML = '';

        if (results.length === 0) {
          document.getElementById('content').style.display = 'none';
          document.getElementById('search-results').style.display = 'block';
          searchResultsList.innerHTML = '<li>No results found</li>';
          return;
        }

        document.getElementById('content').style.display = 'none';
        document.getElementById('search-results').style.display = 'block';

        results.slice(0, 10).forEach(function (result) {
          var item = searchData.find(function (post) {
            return post.url === result.ref;
          });

          if (item) {
            var li = document.createElement('li');
            var excerpt = item.content.substring(0, 200) + '...';
            li.innerHTML = '<h3 class="post-list-title-wrapper"><a href="' + item.url + '">' + item.title + '</a><span class="post-list-date">' + item.date + '</span></h3>' +
                          '<p>' + excerpt + '</p>';
            searchResultsList.appendChild(li);
          }
        });
      }

      // Bind search input
      document.addEventListener('DOMContentLoaded', function () {
        var searchInput = document.getElementById('search-input');
        var searchClear = document.getElementById('search-clear');

        function updateSearch() {
          var query = searchInput.value;

          // Show/hide clear button
          if (query.length > 0) {
            searchClear.style.display = 'block';
          } else {
            searchClear.style.display = 'none';
          }

          if (query.length > 2) {
            performSearch(query);
          } else if (query.length === 0) {
            document.getElementById('search-results').style.display = 'none';
            document.getElementById('content').style.display = 'block';
          }
        }

        if (searchInput) {
          searchInput.addEventListener('keyup', updateSearch);

          // Execute search on page load if there's a value
          if (searchInput.value.length > 0) {
            updateSearch();
          }
        }

        if (searchClear) {
          searchClear.addEventListener('click', function () {
            searchInput.value = '';
            searchClear.style.display = 'none';
            document.getElementById('search-results').style.display = 'none';
            document.getElementById('content').style.display = 'block';
            searchInput.focus();
          });
        }
      });

      // Make all external links open in new tabs
      document.querySelectorAll('a').forEach(function(link) {
        var href = link.getAttribute('href');
        if (href && (href.startsWith('http://') || href.startsWith('https://'))) {
          if (!link.hasAttribute('target')) {
            link.setAttribute('target', '_blank');
            link.setAttribute('rel', 'noopener noreferrer');
          }
        }
      });

      // Add copy buttons to code blocks
      var copyIcon = '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>';
      var checkIcon = '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';

      document.querySelectorAll('.highlight').forEach(function(codeBlock) {
        // Skip if button already exists
        if (codeBlock.querySelector('.copy-button')) {
          return;
        }

        var button = document.createElement('button');
        button.className = 'copy-button';
        button.innerHTML = copyIcon;

        codeBlock.appendChild(button);

        button.addEventListener('click', function() {
          var pre = codeBlock.querySelector('pre');
          var code = pre ? pre.querySelector('code') : codeBlock.querySelector('code');
          var textToCopy = code ? code.textContent : (pre ? pre.textContent : '');

          navigator.clipboard.writeText(textToCopy).then(function() {
            button.innerHTML = checkIcon;
            button.classList.add('copied');

            setTimeout(function() {
              button.innerHTML = copyIcon;
              button.classList.remove('copied');
            }, 2000);
          }).catch(function(err) {
            console.error('Failed to copy text: ', err);
          });
        });
      });
    </script>
  </body>

</html>
